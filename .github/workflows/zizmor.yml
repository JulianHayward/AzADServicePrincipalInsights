# zizmor: security linter for the GitHub Actions workflows of this repository (script injection through ${{ }} expressions,
# excessive permissions, unpinned actions, persisted credentials, ...); the findings are uploaded to the Security tab
# (code scanning). https://docs.zizmor.sh

name: zizmor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  zizmor:
    if: github.repository == 'JulianHayward/AzADServicePrincipalInsights'
    name: zizmor (GitHub Actions security)
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # to upload the SARIF results to code scanning
      actions: read # only required for a private repository by the SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
