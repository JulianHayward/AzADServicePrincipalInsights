<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --text: #1b1f24; --muted: #57606a; --border: #d0d7de;
  --accent: #0f6cbd; --accent-text: #ffffff; --accent-soft: #e6f0fa; --ok: #1a7f37; --ok-soft: #e7f5ea; --warn: #9a6700; --warn-soft: #fff6dd;
  --code-bg: #f6f8fa; --focus: #0f6cbd;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --surface: #1a1e24; --surface-2: #232830; --text: #e6e9ee; --muted: #9aa4b1; --border: #343b45;
    --accent: #4aa3f0; --accent-text: #0b1520; --accent-soft: #16283a; --ok: #4fbf6b; --ok-soft: #15291b; --warn: #e0b34c; --warn-soft: #2d2510;
    --code-bg: #12161b; --focus: #4aa3f0;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
header h1 { font-size: 1.45rem; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); }
.privacy { margin-top: 10px; font-size: .85rem; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; margin-top: 18px; }
.progress { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; padding: 0; list-style: none; }
.progress li { font-size: .82rem; }
.progress button { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 3px 10px; cursor: pointer; font: inherit; text-align: left; }
.progress button:hover { border-color: var(--accent); }
.progress .q { color: var(--muted); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { font-size: 1.2rem; font-weight: 600; padding: 0; margin-bottom: 6px; }
.help { color: var(--muted); margin: 0 0 14px; }
.options { display: grid; gap: 10px; }
.option { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; cursor: pointer; background: var(--surface); }
.option:hover { border-color: var(--accent); }
.option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.option input { margin-top: 4px; accent-color: var(--accent); flex: none; }
.option .label { font-weight: 600; }
.option .desc { display: block; color: var(--muted); font-size: .92rem; }
.badge { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); margin-left: 6px; vertical-align: 1px; }
.fields { display: grid; gap: 14px; }
.field label { display: block; font-weight: 600; }
.field .desc { display: block; color: var(--muted); font-size: .88rem; margin-bottom: 4px; }
.field input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font: 14px/1.4 Consolas, "Cascadia Mono", Menlo, monospace; }
.field .hint { color: var(--warn); font-size: .85rem; min-height: 1em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
button.primary, button.secondary { font: inherit; border-radius: 6px; padding: 8px 18px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); font-weight: 600; }
button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
button:focus-visible, .option:has(input:focus-visible), input:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.error { color: var(--warn); margin-top: 10px; min-height: 1em; }
.plan h2 { font-size: 1.3rem; margin: 0 0 4px; }
.plan .summary { color: var(--muted); margin: 0 0 6px; }
.plan h3 { font-size: 1.08rem; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 12px; margin: 14px 0; }
.step > div { min-width: 0; }
.num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.step h4 { margin: 2px 0 4px; font-size: 1rem; }
.step p, .step ul, .step ol { margin: 4px 0; }
.step ul, .step ol { padding-left: 20px; }
.step code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font: 13px Consolas, "Cascadia Mono", Menlo, monospace; overflow-wrap: anywhere; }
.codeblock { position: relative; margin: 8px 0; }
.codeblock pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; padding-right: 64px; overflow-x: auto; font: 13px/1.5 Consolas, "Cascadia Mono", Menlo, monospace; }
.codeblock pre code { background: none; border: 0; padding: 0; font: inherit; overflow-wrap: normal; }
.codeblock button { position: absolute; top: 6px; right: 6px; font: 12px inherit; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
.check { margin-top: 6px; padding: 7px 10px; border-left: 3px solid var(--ok); background: var(--ok-soft); border-radius: 0 6px 6px 0; font-size: .93rem; }
.note { margin-top: 6px; padding: 7px 10px; border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 6px 6px 0; font-size: .93rem; }
.more { font-size: .9rem; color: var(--muted); margin-top: 4px; }
.status { color: var(--ok); font-size: .9rem; min-height: 1em; }
@media (max-width: 560px) {
  .card { padding: 16px; }
  .step { grid-template-columns: minmax(0, 1fr); }
  .num { margin-bottom: 4px; }
}
@media print {
  body { background: #fff; color: #000; }
  .no-print, .codeblock button, .progress { display: none !important; }
  .card { border: 0; padding: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AzADServicePrincipalInsights setup assistant</h1>
    <p>Answer a few questions - you get the steps for your setup, with the commands filled in.</p>
    <p class="privacy">Everything stays in this page: it sends nothing and stores nothing. Reloading the page starts over.</p>
  </header>
  <ol class="progress no-print" id="progress" aria-label="Your answers"></ol>
  <main class="card" id="main" aria-live="polite"></main>
</div>
<noscript><p style="text-align:center">This page needs JavaScript. The guides: setup/README.md in the repository.</p></noscript>
<script>
'use strict';
(function () {
  var GUIDE = 'https://github.com/JulianHayward/AzADServicePrincipalInsights/blob/main/setup/';
  var REPO = 'https://github.com/JulianHayward/AzADServicePrincipalInsights';
  var GUID = /^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$/;

  var REQUIRED_PERMISSIONS = ['Application.Read.All', 'Group.Read.All', 'RoleManagement.Read.Directory', 'User.Read.All'];
  var OPTIONAL_PERMISSIONS = [
    { v: 'DelegatedPermissionGrant.Read.All', label: 'DelegatedPermissionGrant.Read.All', desc: 'Faster: reads the delegated permission grants once for the tenant instead of once per service principal (same output).', recommended: true },
    { v: 'DirectoryRecommendations.Read.All', label: 'DirectoryRecommendations.Read.All', desc: 'Microsoft Entra recommendations for applications.' },
    { v: 'CustomSecAttributeAssignment.Read.All', label: 'CustomSecAttributeAssignment.Read.All', desc: 'Custom security attributes of service principals.' },
    { v: 'Policy', label: 'Policy.Read.All and Policy.Read.PermissionGrant', desc: 'Tenant consent settings (who may consent to which apps).' }
  ];

  // ---------- state ----------
  var answers = {};   // question id -> value (string, array, or object for fields)
  var history = [];   // ids of the answered questions, in order
  var current = null; // id of the shown question, or 'plan'

  function platform() {
    if (answers.platform === 'unsure') {
      if (answers.regular === 'once') return 'console';
      return answers.repoHost || null;
    }
    return answers.platform || null;
  }
  function pipeline() { var p = platform(); return p === 'github' || p === 'ado'; }
  function servicePrincipalRun() { return pipeline() || (platform() === 'console' && answers.account === 'sp'); }
  function adoNew() { return platform() === 'ado' && answers.adoExisting === 'new'; }
  function adoOption() {
    if (answers.adoCanCreate === 'no') return 'C';
    if (answers.adoCanCreate === 'yes' && answers.adoAuto === 'yes') return 'B';
    return 'A';
  }
  function features() { return pipeline() ? (answers.features || []) : []; }
  function has(feature) { return features().indexOf(feature) >= 0; }

  // ---------- questions ----------
  var QUESTIONS = [
    { id: 'platform', title: 'Where do you want to run AzADServicePrincipalInsights?', type: 'single',
      options: [
        { v: 'console', label: 'On my computer, or in a GitHub Codespace', desc: 'A report now - good for trying it out or a one-time report. You sign in as yourself.' },
        { v: 'github', label: 'GitHub Actions', desc: 'Regular reports, saved in a private GitHub repository.' },
        { v: 'ado', label: 'Azure DevOps', desc: 'Regular reports, saved in a private Azure DevOps repository.' },
        { v: 'unsure', label: 'Not sure - help me choose' }
      ] },
    { id: 'regular', when: function () { return answers.platform === 'unsure'; }, title: 'Do you need the report once, or regularly?', type: 'single',
      help: 'All ways produce the same report. If in doubt, start with once: you have a report within minutes and can set up a pipeline later.',
      options: [
        { v: 'once', label: 'Once, or now and then', desc: 'Run it from your computer or a Codespace.' },
        { v: 'regular', label: 'Regularly, e.g. twice a day', desc: 'A pipeline or workflow runs it and keeps the history of changes.' }
      ] },
    { id: 'repoHost', when: function () { return answers.platform === 'unsure' && answers.regular === 'regular'; }, title: 'Where does your team keep its code?', type: 'single',
      options: [
        { v: 'github', label: 'GitHub', desc: 'The workflow runs in a private GitHub repository.' },
        { v: 'ado', label: 'Azure DevOps', desc: 'The pipeline runs in a private Azure DevOps project.' }
      ] },
    { id: 'account', when: function () { return platform() === 'console'; }, title: 'Which account will run it?', type: 'single',
      options: [
        { v: 'member', label: 'My normal user account', desc: 'A member of the tenant. The most common case.' },
        { v: 'guest', label: 'A guest account', desc: 'Invited from another tenant.' },
        { v: 'sp', label: 'A service principal', desc: 'An app registration with a client secret.' }
      ] },
    { id: 'where', when: function () { return platform() === 'console'; }, title: 'Where do you run it?', type: 'single',
      options: [
        { v: 'computer', label: 'On my computer', desc: 'Windows, Linux or macOS with PowerShell 7.' },
        { v: 'codespace', label: 'In a GitHub Codespace', desc: 'Nothing to install - PowerShell and the modules are included.' }
      ] },
    { id: 'ghSignin', when: function () { return platform() === 'github'; }, title: 'How should the workflow sign in?', type: 'single',
      options: [
        { v: 'oidc', label: 'Federated credential', badge: 'recommended', desc: 'No secret to store or renew.' },
        { v: 'secret', label: 'Client secret', desc: 'The secret expires - you must renew it.' }
      ] },
    { id: 'adoExisting', when: function () { return platform() === 'ado'; }, title: 'Is this a new setup?', type: 'single',
      options: [
        { v: 'new', label: 'Yes, a new setup' },
        { v: 'existing', label: 'No - AzADServicePrincipalInsights already runs in Azure DevOps', desc: 'You want to convert the service connection to the new issuer, update to a new version, or add a feature.' }
      ] },
    { id: 'adoCanCreate', when: adoNew, title: 'May you create app registrations in Microsoft Entra ID?', type: 'single',
      help: 'The pipeline signs in as an app registration or a managed identity.',
      options: [
        { v: 'yes', label: 'Yes' },
        { v: 'no', label: 'No', desc: 'The pipeline uses a managed identity instead.' },
        { v: 'unsure', label: 'I don’t know', desc: 'The plan shows how to find out.' }
      ] },
    { id: 'adoAuto', when: function () { return adoNew() && answers.adoCanCreate === 'yes'; }, title: 'Who should create the app registration?', type: 'single',
      options: [
        { v: 'no', label: 'I create it myself', badge: 'recommended', desc: 'You control its name and its rights.' },
        { v: 'yes', label: 'Azure DevOps creates it', desc: 'Quicker. You must be ‘Owner’ of the management group, and you reduce its rights to ‘Reader’ afterwards.' }
      ] },
    { id: 'optionalPermissions', when: function () { return servicePrincipalRun() && answers.adoExisting !== 'existing'; }, title: 'Which optional data do you want?', type: 'multi',
      help: 'Each needs one more Microsoft Graph permission. Without it, the run works and the report says the data was not collected.',
      options: OPTIONAL_PERMISSIONS, defaults: ['DelegatedPermissionGrant.Read.All'] },
    { id: 'features', when: pipeline, title: 'Do you want any of these optional features?', type: 'multi',
      help: 'You can add them later too.',
      options: [
        { v: 'webapp', label: 'Publish the report to a website', desc: 'An Azure Web App that only the members of a group can open.' },
        { v: 'la', label: 'Send the data to Log Analytics', desc: 'Query and alert on it in Log Analytics or Microsoft Sentinel.' }
      ] },
    { id: 'webLicense', when: function () { return has('webapp'); }, title: 'Does your tenant have Microsoft Entra ID P1 or P2?', type: 'single',
      help: 'Microsoft Entra admin center > Overview > field License.',
      options: [
        { v: 'p1', label: 'P1 or P2', desc: 'Only the group members can sign in to the web app.' },
        { v: 'free', label: 'Free, or I don’t know', desc: 'Everybody in the tenant can sign in, but the web app only shows the report to the group members.' }
      ] },
    { id: 'webTeams', when: function () { return has('webapp'); }, title: 'Who sets up the web app?', type: 'single',
      options: [
        { v: 'one', label: 'One person with both roles', desc: '‘Cloud Application Administrator’ (or ‘Application Administrator’) in Microsoft Entra ID and ‘Owner’ of the Azure resource group. One script does it all.' },
        { v: 'two', label: 'Two teams', desc: 'An Entra admin and an Azure admin each do their part.' }
      ] },
    { id: 'laAssign', when: function () { return has('la'); }, title: 'May you assign roles on the resource group of the Log Analytics workspace?', type: 'single',
      help: '‘Owner’, ‘User Access Administrator’ or ‘Role Based Access Control Administrator’.',
      options: [
        { v: 'yes', label: 'Yes', desc: 'The template gives your pipeline identity its role in the same step.' },
        { v: 'no', label: 'No', desc: 'Somebody else assigns the role afterwards.' }
      ] },
    { id: 'values', when: function () { return !(platform() === 'ado' && answers.adoExisting === 'existing' && !features().length); }, title: 'Fill in your values (optional)', type: 'fields',
      help: 'They are only used to fill in the commands of your plan. Leave a field empty to keep the placeholder.',
      fields: function () {
        var f = [
          { id: 'tenantId', label: 'Tenant ID', desc: 'Microsoft Entra admin center > Overview > Tenant ID', guid: true },
          { id: 'mgId', label: 'Management group ID', desc: 'Azure portal > Management groups > your management group > ID (not the display name). Usually the Tenant Root Group, whose ID is the tenant ID.' }
        ];
        if (has('webapp') || has('la')) {
          f.push({ id: 'pipelineObjectId', label: 'Object ID of the pipeline identity', desc: 'Microsoft Entra admin center > Enterprise applications > your pipeline identity > Object ID (not the application ID). Leave empty if it does not exist yet.', guid: true });
        }
        if (has('webapp')) {
          f.push({ id: 'webSubscriptionId', label: 'Web app: subscription ID', guid: true });
          f.push({ id: 'webResourceGroup', label: 'Web app: resource group', desc: 'An existing resource group, e.g. rg-azadspi' });
          f.push({ id: 'webAppName', label: 'Web app: name', desc: 'Unique worldwide - it becomes https://<name>.azurewebsites.net', pattern: /^[a-zA-Z0-9][a-zA-Z0-9-]{0,58}[a-zA-Z0-9]$/, patternHint: '2-60 characters: letters, digits and hyphens, not starting or ending with a hyphen' });
          f.push({ id: 'webGroupId', label: 'Web app: object ID of the viewer group', desc: 'Microsoft Entra admin center > Groups > your security group > Object ID', guid: true });
        }
        if (has('la')) {
          f.push({ id: 'laSubscriptionId', label: 'Log Analytics: subscription ID of the workspace', guid: true });
          f.push({ id: 'laResourceGroup', label: 'Log Analytics: resource group of the workspace' });
          f.push({ id: 'laWorkspace', label: 'Log Analytics: workspace name' });
        }
        return f;
      } }
  ];
  function question(id) { for (var i = 0; i < QUESTIONS.length; i++) { if (QUESTIONS[i].id === id) return QUESTIONS[i]; } return null; }
  function applies(q) { return !q.when || q.when(); }
  function nextQuestion() {
    for (var i = 0; i < QUESTIONS.length; i++) {
      var q = QUESTIONS[i];
      if (applies(q) && history.indexOf(q.id) < 0) return q.id;
    }
    return 'plan';
  }

  // ---------- DOM helpers ----------
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (k === 'text') e.textContent = attrs[k];
        else if (k === 'className') e.className = attrs[k];
        else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
        else e.setAttribute(k, attrs[k]);
      }
    }
    (children || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  // inline markup for the fixed texts of this page (never for typed values): `code`, **bold**, [text](https://...)
  function rich(text) {
    var span = document.createElement('span');
    var re = /`([^`]+)`|\*\*([^*]+)\*\*|\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g;
    var last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) span.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1] !== undefined) span.appendChild(el('code', { text: m[1] }));
      else if (m[2] !== undefined) span.appendChild(el('strong', { text: m[2] }));
      else span.appendChild(el('a', { href: m[4], target: '_blank', rel: 'noopener noreferrer', text: m[3] }));
      last = re.lastIndex;
    }
    if (last < text.length) span.appendChild(document.createTextNode(text.slice(last)));
    return span;
  }
  function copyText(text, button) {
    function done(ok) { var t = button.textContent; button.textContent = ok ? 'Copied' : 'Copy failed'; setTimeout(function () { button.textContent = t; }, 1500); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback()); });
    } else { done(fallback()); }
    function fallback() {
      var ta = el('textarea', { style: 'position:fixed;left:-9999px;top:0' }); ta.value = text; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta); return ok;
    }
  }

  // ---------- values in commands ----------
  function value(id) { var v = answers.values && answers.values[id]; return v ? String(v).trim() : ''; }
  // a PowerShell argument: the typed value (quoted when needed) or the placeholder
  function ps(id, placeholder) {
    var v = value(id);
    if (!v) return '<' + placeholder + '>';
    return /^[A-Za-z0-9._-]+$/.test(v) ? v : "'" + v.replace(/'/g, "''") + "'";
  }
  function plain(id, placeholder) { return value(id) || '<' + placeholder + '>'; }
  function mgReference() {
    var mg = value('mgId'); if (!mg) return '<management group ID>';
    var ids = mg.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var tid = value('tenantId');
    if (ids.length > 1 && tid && ids.indexOf(tid) >= 0) return tid;
    return ids.join('_');
  }
  function selectedPermissions() {
    var list = REQUIRED_PERMISSIONS.slice();
    (answers.optionalPermissions || []).forEach(function (p) {
      if (p === 'Policy') { list.push('Policy.Read.All'); list.push('Policy.Read.PermissionGrant'); } else list.push(p);
    });
    return list;
  }
  function permissionsText() { return selectedPermissions().map(function (p) { return '`' + p + '`'; }).join(', '); }

  // ---------- plan ----------
  function link(file, anchor, text) { return '[' + text + '](' + GUIDE + file + (anchor ? '#' + anchor : '') + ')'; }

  function graphPortalStep(where) {
    return { title: 'Allow ' + where + ' to read Microsoft Entra ID',
      text: ['A ‘**Privileged Role Administrator**’ or ‘**Global Administrator**’ grants the Microsoft Graph application permissions: ' + permissionsText() + '.',
        '[Microsoft Entra admin center](https://entra.microsoft.com/) > **App registrations** > **All applications** > your app registration > **API permissions** > **Add a permission** > **Microsoft Graph** > **Application permissions** > select them > **Add permissions** > **Grant admin consent for <tenant>** > **Yes**.'],
      check: '**API permissions** shows the permissions with the status **Granted for <tenant>**.' };
  }
  function graphScriptStep() {
    var code = [
      'Connect-AzAccount -TenantId ' + ps('tenantId', 'tenant ID'),
      "$principalId = '" + plain('pipelineObjectId', 'object (principal) ID of the managed identity').replace(/'/g, "''") + "'",
      '$permissions = ' + selectedPermissions().map(function (p) { return "'" + p + "'"; }).join(', '),
      '',
      "$graph = (Invoke-AzRestMethod -Uri \"https://graph.microsoft.com/v1.0/servicePrincipals(appId='00000003-0000-0000-c000-000000000000')\").Content | ConvertFrom-Json",
      '$granted = ((Invoke-AzRestMethod -Uri "https://graph.microsoft.com/v1.0/servicePrincipals/$principalId/appRoleAssignments").Content | ConvertFrom-Json).value.appRoleId',
      'foreach ($permission in $permissions) {',
      "    $appRoleId = ($graph.appRoles | Where-Object { $_.value -eq $permission -and $_.allowedMemberTypes -contains 'Application' }).id",
      '    if ($appRoleId -in $granted) { "$permission - already granted"; continue }',
      '    $body = @{ principalId = $principalId; resourceId = $graph.id; appRoleId = $appRoleId } | ConvertTo-Json',
      '    $result = Invoke-AzRestMethod -Method POST -Uri "https://graph.microsoft.com/v1.0/servicePrincipals/$principalId/appRoleAssignments" -Payload $body',
      "    \"$permission - $(if ($result.StatusCode -eq 201) { 'granted' } else { $result.Content })\"",
      '}'
    ].join('\n');
    return { title: 'Allow the managed identity to read Microsoft Entra ID',
      text: ['A managed identity has no **API permissions** page. A ‘**Privileged Role Administrator**’ or ‘**Global Administrator**’ runs this (needs only the module `Az.Accounts`). Permissions: ' + permissionsText() + '.'],
      code: code,
      check: 'Microsoft Entra admin center > **Enterprise applications** > filter **Application type** = **Managed Identities** > your identity > **Permissions** lists them.',
      more: link('README.md', 'microsoft-graph', 'Permissions reference') };
  }

  function consolePlan() {
    var steps = [];
    var account = answers.account, codespace = answers.where === 'codespace';
    var reader = { title: 'Check that you can read the management group',
      text: ['You need ‘**Reader**’ (or more) on the management group - usually the **Tenant Root Group**. [Azure portal](https://portal.azure.com) > **Management groups** > your management group > **Access control (IAM)** > **Check access** > **View my access**.',

      return a.map(function (v) { var o = q.options.filter(function (x) { return x.v === v; })[0]; return o ? o.label : v; }).join(', ');

  function renderQuestion(main, q) {
    var form = el('form', { novalidate: 'novalidate' });
    var fs = el('fieldset');
    fs.appendChild(el('legend', { text: q.title }));
    if (q.help) fs.appendChild(el('p', { className: 'help' }, [rich(q.help)]));
    var error = el('p', { className: 'error', role: 'alert' });
    if (q.type === 'fields') {
      var box = el('div', { className: 'fields' });
      var saved = answers.values || {};
      q.fields().forEach(function (f) {
        var input = el('input', { type: 'text', id: 'f-' + f.id, name: f.id, autocomplete: 'off', spellcheck: 'false' });
        input.value = saved[f.id] || '';
        var hint = el('span', { className: 'hint', 'aria-live': 'polite' });
        function validate() {
          var v = input.value.trim();
          hint.textContent = !v ? '' : (f.guid && !GUID.test(v)) ? 'This doesn’t look like an ID (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx).' : (f.pattern && !f.pattern.test(v)) ? f.patternHint : '';
        }
        input.addEventListener('input', validate); validate();
        box.appendChild(el('div', { className: 'field' }, [el('label', { for: 'f-' + f.id, text: f.label }), f.desc ? el('span', { className: 'desc', text: f.desc }) : null, input, hint]));
      });
      fs.appendChild(box);
    } else {
      var opts = el('div', { className: 'options' });
      var prev = answers[q.id];
      q.options.forEach(function (o, i) {
        var input = el('input', { type: q.type === 'multi' ? 'checkbox' : 'radio', name: q.id, value: o.v, id: q.id + '-' + i });
        if (q.type === 'multi') input.checked = prev ? prev.indexOf(o.v) >= 0 : (q.defaults || []).indexOf(o.v) >= 0;
        else input.checked = prev === o.v;
        var text = el('span', null, [el('span', { className: 'label', text: o.label }), o.badge ? el('span', { className: 'badge', text: o.badge }) : null, o.desc ? el('span', { className: 'desc', text: o.desc }) : null]);
        opts.appendChild(el('label', { className: 'option', for: q.id + '-' + i }, [input, text]));
      });
      fs.appendChild(opts);
    }
    form.appendChild(fs);
    form.appendChild(error);
    var actions = el('div', { className: 'actions' });
    actions.appendChild(el('button', { type: 'submit', className: 'primary', text: q.type === 'fields' ? 'Show my plan' : 'Next' }));
    if (history.length) actions.appendChild(el('button', { type: 'button', className: 'secondary', text: 'Back', onclick: function () { goBack(history.length - 1); } }));
    if (history.length) actions.appendChild(el('button', { type: 'button', className: 'secondary', text: 'Start over', onclick: startOver }));
    form.appendChild(actions);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (q.type === 'fields') {
        var vals = {};
        q.fields().forEach(function (f) { vals[f.id] = form.elements[f.id].value.trim(); });
        answers.values = vals;
      } else if (q.type === 'multi') {
        answers[q.id] = Array.prototype.map.call(form.querySelectorAll('input:checked'), function (i) { return i.value; });
      } else {
        var checked = form.querySelector('input:checked');
        if (!checked) { error.textContent = 'Please choose an option.'; return; }
        answers[q.id] = checked.value;
      }
      history.push(q.id);
      // answers to questions that no longer apply are dropped (e.g. after switching from GitHub to Azure DevOps)
      QUESTIONS.forEach(function (x) { if (x.id !== 'values' && history.indexOf(x.id) < 0 && !applies(x)) delete answers[x.id]; });
      current = nextQuestion();
      render();
    });
    main.appendChild(form);
  }

  function renderPlan(main) {
    var plan = el('div', { className: 'plan' });
    plan.appendChild(el('h2', { text: 'Your setup plan' }));
    plan.appendChild(el('p', { className: 'summary', text: planSummary() }));
    plan.appendChild(el('p', null, [rich('Do the steps in this order. Each step links to the full description in the [setup guides](' + GUIDE + 'README.md).')]));
    var n = 0;
    buildPlan().forEach(function (section) {
      plan.appendChild(el('h3', { text: section.title }));
      section.steps.forEach(function (s) {
        n++;
        var body = el('div');
        body.appendChild(el('h4', { text: s.title }));
        (s.text || []).forEach(function (t) { body.appendChild(el('p', null, [rich(t)])); });
        if (s.code) body.appendChild(codeBlock(s.code));
        (s.text2 || []).forEach(function (t) { body.appendChild(el('p', null, [rich(t)])); });
        if (s.note) body.appendChild(el('div', { className: 'note' }, [rich(s.note)]));
        if (s.check) body.appendChild(el('div', { className: 'check' }, [el('strong', { text: 'Check: ' }), rich(s.check)]));
        if (s.more) body.appendChild(el('p', { className: 'more' }, [rich('Details: ' + s.more)]));
        plan.appendChild(el('div', { className: 'step' }, [el('div', { className: 'num', 'aria-hidden': 'true', text: String(n) }), body]));
      });
    });
    var status = el('p', { className: 'status', role: 'status' });
    var actions = el('div', { className: 'actions no-print' }, [
      el('button', { type: 'button', className: 'primary', text: 'Copy plan as Markdown', onclick: function (e) { copyText(planMarkdown(plan), e.currentTarget); } }),
      el('button', { type: 'button', className: 'secondary', text: 'Print', onclick: function () { window.print(); } }),
      el('button', { type: 'button', className: 'secondary', text: 'Back', onclick: function () { goBack(history.length - 1); } }),
      el('button', { type: 'button', className: 'secondary', text: 'Start over', onclick: startOver })
    ]);
    plan.appendChild(actions);
    plan.appendChild(status);
    main.appendChild(plan);
  }
  function codeBlock(code) {
    var pre = el('pre', null, [el('code', { text: code })]);
    return el('div', { className: 'codeblock' }, [pre, el('button', { type: 'button', text: 'Copy', 'aria-label': 'Copy the command', onclick: function (e) { copyText(code, e.currentTarget); } })]);
  }
  function planMarkdown(plan) {
    var out = ['# AzADServicePrincipalInsights setup plan', '', plan.querySelector('.summary').textContent, ''];
    plan.querySelectorAll('h3, .step').forEach(function (node) {
      if (node.tagName === 'H3') { out.push('## ' + node.textContent, ''); return; }
      var num = node.querySelector('.num').textContent;
      var body = node.children[1];
      Array.prototype.forEach.call(body.children, function (c) {
        if (c.tagName === 'H4') out.push('### ' + num + '. ' + c.textContent, '');
        else if (c.classList.contains('codeblock')) out.push('```', c.querySelector('code').textContent, '```', '');
        else out.push(inlineMarkdown(c), '');
      });
    });
    return out.join('\n');
  }
  function inlineMarkdown(node) {
    var s = '';
    node.childNodes.forEach(function (c) {
      if (c.nodeType === 3) s += c.textContent;
      else if (c.tagName === 'CODE') s += '`' + c.textContent + '`';
      else if (c.tagName === 'STRONG') s += '**' + c.textContent + '**';
      else if (c.tagName === 'A') s += '[' + c.textContent + '](' + c.getAttribute('href') + ')';
      else s += inlineMarkdown(c);
    });
    return s;
  }
  function startOver() { answers = {}; history = []; current = nextQuestion(); render(); }

  current = nextQuestion();
  render();
  // for the tests: the plan as data
  window.__azadspiSetup = { answers: function () { return answers; }, plan: function () { return buildPlan(); } };
})();
</script>
